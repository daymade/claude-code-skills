[project]
name = "daymade-skill-creator-runtime"
version = "0.0.0"
description = "Locked local runtime for the bundled skill-creator tools"
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.2",
    "pytest==9.1.1",
    "tiktoken==0.14.0",
    "semgrep==1.185.0",
]

[tool.uv]
package = false
# Require the interface used by version-scoped dependency overrides.
required-version = ">=0.11.25"
# Replace only this Semgrep release's vulnerable SDK pins; keep the patched
# OpenTelemetry family aligned. Recheck the ordinary scan before changing these.
override-dependencies = [
    { package = { name = "semgrep", version = "1.185.0" }, dependencies = [
        "mcp==1.30.0",
        "opentelemetry-api==1.45.2",
        "opentelemetry-sdk==1.45.2",
        "opentelemetry-exporter-otlp-proto-http==1.45.2",
    ] },
]
