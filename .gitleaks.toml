# Gitleaks custom rules for claude-code-skills repo
# Catches personal info that shouldn't be in an open source repo

title = "claude-code-skills sensitive data rules"

[extend]
useDefault = true

# Global allowlist: files that are allowed to contain patterns
# (the config file itself, hooks, and contribution guides)
[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''\.githooks/''',
  # NOTE: CONTRIBUTING.md and CLAUDE.md used to sit here, exempting those two
  # files from EVERY rule. They are prose files where example names, paths and
  # keys get written by hand — the exact place a leak is authored — so a blanket
  # exemption there inverted the gate. Measured 2026-09-18 before removing it:
  # zero findings appear across this repo's whole tree without it, so the
  # exemption was buying nothing and hiding a class.
]
regexes = [
  # Douban mobile app's public API key (documented as public, hardcoded for zero-config usage)
  '''0dad551ec0f84ed02907ff5c42e8ec70''',
  # Standard example JWT header from jwt.io. Base64URL-decodes to:
  #   {"alg":"HS256","typ":"JWT"}
  # It is public metadata, not a secret, and appears in repomix-safe-mixer
  # documentation as a placeholder (literally written with "..." suffix).
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
  # Repo owner's public contact email in README/marketplace metadata
  '''daymadev89@gmail\.com''',
  # Common placeholder user paths used in documentation examples
  '''/Users/(?:username|name|you|user)/''',
  '''/home/username/''',
  '''C:\\Users\\(?:username|name)\\''',
]

[[rules]]
id = "absolute-user-path-macos"
description = "Hardcoded macOS user home directory path"
regex = '''/Users/[a-zA-Z][a-zA-Z0-9_-]+/'''
tags = ["pii", "path"]

[[rules]]
id = "absolute-user-path-linux"
description = "Hardcoded Linux home directory path"
regex = '''/home/[a-zA-Z][a-zA-Z0-9_-]+/'''
tags = ["pii", "path"]

[[rules]]
id = "windows-user-path"
description = "Hardcoded Windows user profile path"
regex = '''C:\\Users\\[a-zA-Z][a-zA-Z0-9_-]+\\'''
tags = ["pii", "path"]

[[rules]]
id = "phone-number-cn"
description = "Chinese mobile phone number"
regex = '''\b1[3-9]\d{9}\b'''
tags = ["pii", "phone"]

[[rules]]
id = "email-personal"
description = "Personal email address"
regex = '''[a-zA-Z0-9._%+-]+@(?:gmail|qq|163|126|outlook|hotmail|yahoo|icloud|foxmail)\.[a-zA-Z]{2,}'''
tags = ["pii", "email"]


# ── LLM / AI provider API keys ──────────────────────────────────────────────
# gitleaks' bundled ruleset covers OpenAI, AWS and GitHub but has no Anthropic
# rule. Measured 2026-09-18 against this repo's own CI config: a realistic
# sk-ant-api03-… key scanned clean. For a repository of Claude Code skills that
# is the single most likely key shape to be pasted in by mistake.

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-api/admin)"
regex = '''\bsk-ant-(api|admin)[0-9]{2}-[a-zA-Z0-9_-]{60,}\b'''
tags = ["key", "anthropic"]

[[rules]]
id = "moonshot-kimi-api-key"
description = "Moonshot / Kimi API key (sk-kimi- prefix)"
regex = '''\bsk-kimi-[a-zA-Z0-9]{40,}\b'''
tags = ["key", "moonshot", "kimi"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key (sk-or-v1-)"
regex = '''\bsk-or-v1-[a-f0-9]{40,}\b'''
tags = ["key", "openrouter"]

[[rules]]
id = "openai-project-key"
description = "OpenAI project/service/admin key"
regex = '''\bsk-(proj|svcacct|admin)-[a-zA-Z0-9_-]{20,}\b'''
tags = ["key", "openai"]

[[rules]]
id = "generic-sk-bearer"
description = "Generic sk- prefixed secret (fallback for unknown providers)"
regex = '''(?:^|[^a-zA-Z0-9_-])sk-[a-zA-Z][a-zA-Z0-9_-]{39,}(?:$|[^a-zA-Z0-9_-])'''
tags = ["key", "generic"]
[rules.allowlist]
regexes = [
  '''sk-test-''',
  '''sk-example''',
  '''sk-placeholder''',
  '''sk-your-''',
  '''sk-xxx''',
  '''sk-<[a-z_-]+>''',
  # SK hynix, the memory manufacturer, in any prose about hardware.
  '''(?i)sk-hynix''',
]
